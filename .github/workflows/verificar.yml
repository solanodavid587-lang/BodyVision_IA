name: Verificar BodyVision
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/bodyWidths.test.mjs
      - run: npm run build
      - run: VITE_ENTERPRISE=true npm run build && test ! -d dist/models
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bodyvision_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost/bodyvision_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: alembic upgrade head && alembic check
      - run: python -m pytest -q
      - name: Restaurar una copia en una base desechable
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CONTAINER" pg_dump -U postgres -Fc bodyvision_ci > "$RUNNER_TEMP/bodyvision.dump"
          docker exec "$CONTAINER" createdb -U postgres restored_ci
          docker exec -i "$CONTAINER" pg_restore -U postgres --exit-on-error -d restored_ci < "$RUNNER_TEMP/bodyvision.dump"
          test "$(docker exec "$CONTAINER" psql -U postgres -d restored_ci -Atc 'select version_num from alembic_version')" = 0002

services:
  - type: web
    name: bodyvision-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./bodyvision.db
      - key: DEMO_MODE
        value: true
      - key: CORS_ORIGINS
        sync: false
